{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="container auth-card section-fade" style="max-width:440px;">
    <div class="glass p-4 p-md-5 rounded-4 border border-danger border-opacity-25">
      <h1 class="h4 fw-extrabold mb-2"><i class="fa-solid fa-shield-halved text-danger me-2"></i>Admin</h1>
      <p class="text-muted small mb-4">Restricted access for store managers.</p>
      <form method="post" class="vstack gap-3">
        <input type="text" name="username" class="form-control form-control-lg" placeholder="Admin username" required autofocus>
        <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
        <button type="submit" class="btn btn-danger btn-lg w-100 rounded-pill fw-bold">Enter dashboard</button>
      </form>
      <p class="small text-muted mt-3 mb-0">Use <code>admin</code> / <code>admin123</code> after init.</p>
    </div>
  </div>
</div>
{% endblock %}
