{% extends "admin/layout.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h1 class="h4 fw-bold mb-0">Products</h1>
  <a href="{{ url_for('admin_product_form') }}" class="btn btn-brand"><i class="fa-solid fa-plus me-1"></i>Add product</a>
</div>
<div class="table-responsive glass rounded-4">
  <table class="table align-middle mb-0">
    <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
    <tbody>
      {% for p in products %}
      <tr>
        <td style="width:64px;"><img src="{% if p.image and p.image.startswith('http') %}{{ p.image }}{% else %}{{ url_for('static', filename='images/' ~ (p.image or 'placeholder.svg')) }}{% endif %}" class="rounded-2 w-100" style="max-height:48px;object-fit:cover;" alt=""></td>
        <td class="fw-semibold">{{ p.name }}</td>
        <td>{{ p.cat }}</td>
        <td>₹{{ '{:,.0f}'.format(p.price) }}</td>
        <td>{{ p.stock }}</td>
        <td class="text-end">
          <a href="{{ url_for('admin_product_form', pid=p.id) }}" class="btn btn-sm btn-outline-glow">Edit</a>
          <form action="{{ url_for('admin_product_delete', pid=p.id) }}" method="post" class="d-inline" onsubmit="return confirm('Delete this product?');">
            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
