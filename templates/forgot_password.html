{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="container auth-card section-fade">
    <div class="glass p-4 p-md-5 rounded-4">
      <h1 class="h3 fw-extrabold mb-2">Reset password</h1>
      <p class="text-muted mb-4">Enter your email — this demo shows a confirmation message only (no email is sent).</p>
      <form method="post" class="vstack gap-3">
        <div>
          <label class="form-label small fw-semibold">Email</label>
          <input type="email" name="email" class="form-control form-control-lg" required>
        </div>
        <button type="submit" class="btn btn-brand btn-lg w-100">Send reset link</button>
      </form>
      <a href="{{ url_for('login') }}" class="btn btn-link w-100 mt-2">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
