{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="container auth-card section-fade">
    <div class="glass p-4 p-md-5 rounded-4 position-relative overflow-hidden">
      <div class="position-absolute top-0 end-0 opacity-25" style="width:200px;height:200px;background:radial-gradient(circle,rgba(37,99,235,0.6),transparent);transform:translate(30%,-30%);"></div>
      <div class="position-relative">
        <h1 class="h3 fw-extrabold mb-2">Welcome back</h1>
        <p class="text-muted mb-4">Sign in to track orders and checkout faster.</p>
        <form method="post" class="vstack gap-3 needs-validation" novalidate>
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
          <div>
            <label class="form-label small fw-semibold">Username or email</label>
            <input type="text" name="username" class="form-control form-control-lg" required autofocus>
          </div>
          <div>
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg" required>
          </div>
          <button type="submit" class="btn btn-brand btn-lg w-100">Sign in</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot password?</a>
          <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Create account</a>
        </div>
        <p class="small text-muted mt-4 mb-0">Demo admin: <code>admin</code> / <code>admin123</code></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
